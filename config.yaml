app_defaults:
  llm_provider: "anthropic"
  # Fallback model names. When the provider's model list can be fetched, the sidebar preselects the
  # newest model of the same family as the name here (Opus for Anthropic, Luna for OpenAI; the rule is
  # in core/model_choice.py). These names are used as-is only when the list is unavailable. To change
  # the family, name a model of that family here (say "claude-sonnet-5-5").
  model_name_anthropic: "claude-opus-5-5"
  model_name_openai: "gpt-6-luna"
  max_categories: 500
  max_sentences_per_category: 300
  max_tokens: 10000

cli_audit:
  audit_file: ""
  model_tree: ""
  audit_in_progress: ""
  llm_provider: "anthropic"
  model_name: ""
  max_categories: 500
  max_sentences_per_category: 1001
  max_tokens: 10000

cli_summary:
  audit_file: ""
